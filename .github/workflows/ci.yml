name: MBSS tests
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: python -m pip install -e .
      - run: python -m unittest discover -s tests -v
      - run: node --test tests/test_publish_release.cjs
      - name: Calendar dependency must actually be installed
        run: python -c "import exchange_calendars; print(exchange_calendars.__version__)"
      - name: Fail-closed smoke report
        run: mbss run --input data/empty --output runs/ci-smoke
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mbss-ci-smoke
          path: runs/ci-smoke/
          retention-days: 7
