name: MBSS research prerelease
on:
  push:
    branches: [main]
    paths: [pyproject.toml]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: mbss-release
  cancel-in-progress: false
jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: python -m pip install -e .
      - name: Test the release commit
        run: |
          python -m unittest discover -s tests -v
          node --test tests/test_publish_release.cjs
      - name: Verify fail-closed report
        run: |
          python -m mbss.cli run --input data/empty --output runs/release-smoke
          python - <<'PY'
          import json
          q=json.load(open('runs/release-smoke/signal_events.json'))
          quality=json.load(open('runs/release-smoke/data_quality.json'))
          assert q['assessment']['SAFE_TO_ACT'] is False
          assert q['assessment']['SIGNAL_STATUS']=='DATA_HOLD'
          assert quality['status']=='DATA_HOLD'
          PY
      - name: Identify tested source and provenance
        id: identity
        run: python scripts/release_metadata.py
      - name: Publish research prerelease
        if: steps.identity.outputs.skip_publish != 'true'
        uses: actions/github-script@v8
        env:
          RELEASE_TAG: ${{ steps.identity.outputs.tag }}
          SOURCE_COMMIT: ${{ steps.identity.outputs.source_commit }}
        with:
          github-token: ${{ github.token }}
          script: |
            const publishRelease=require(process.env.GITHUB_WORKSPACE+'/scripts/publish_release.cjs');
            const url=await publishRelease({github,context,tag:process.env.RELEASE_TAG,
              sourceCommit:process.env.SOURCE_COMMIT,manifestPath:'release.json'});
            core.info(`Published research prerelease ${url}`);
